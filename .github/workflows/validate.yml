name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prompt format
        run: python scripts/validate_prompts.py
      - name: Rebuild index, folder READMEs and search page
        run: python scripts/build_index.py
      - name: Fail if generated docs are stale
        run: |
          git diff --exit-code -- prompts.json prompts/*/README.md docs/search.html \
            || (echo "::error::generated files are out of date — run: python scripts/build_index.py" && exit 1)
      - name: Check markdown links
        run: python scripts/check_links.py
