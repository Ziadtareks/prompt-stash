name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prompt format
        run: python scripts/validate_prompts.py
      - name: Rebuild index and folder READMEs
        run: python scripts/build_index.py
      - name: Fail if generated docs are stale
        run: |
          git diff --exit-code -- prompts.json prompts/*/README.md \
            || (echo "::error::prompts.json or folder READMEs are out of date — run: python scripts/build_index.py" && exit 1)
      - name: Check markdown links
        run: python scripts/check_links.py
